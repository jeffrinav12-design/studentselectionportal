<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002B49"/>
      <stop offset="100%" stop-color="#001424"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B48E25"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Outer Golden Border Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="12 6" opacity="0.8"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Center Crest Container -->
  <g filter="url(#shadow)">
    <!-- Graduation Cap (Mortarboard) -->
    <path d="M 256 120 L 390 185 L 256 250 L 122 185 Z" fill="url(#goldGrad)"/>
    <path d="M 180 220 L 180 280 C 180 320 332 320 332 280 L 332 220 L 256 255 Z" fill="#D4AF37" opacity="0.9"/>
    <!-- Tassel -->
    <path d="M 370 195 L 390 280 C 390 290 380 295 375 295 C 370 295 365 290 365 280 Z" fill="#FCD34D"/>
    <circle cx="256" cy="185" r="8" fill="#FFFFFF"/>
  </g>

  <!-- Institution Monogram & Title -->
  <text x="256" y="375" font-family="'Cinzel', 'Outfit', serif, sans-serif" font-size="44" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">SANKARA</text>
  <text x="256" y="415" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="3">ACADEMIC PORTAL</text>
  <text x="256" y="445" font-family="'Outfit', sans-serif" font-size="15" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="2">DEPT OF CS WITH DATA ANALYTICS</text>
</svg>

